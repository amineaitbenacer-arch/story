<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>بيبيات الأطلس | متجر الطيور المغربي</title>
  <meta name="description" content="أحسن متجر طيور بالمغرب. كناري، لافبيرد، كوكاتيل، بادجي وأكثر. أسعار مناسبة وجودة مضمونة."/>
  <!-- Facebook & TikTok Pixel -->
  <script src="pixels.js"></script>
  <!-- Single font only — fastest load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" media="print" onload="this.media='all'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap"/></noscript>
  <style>
    :root{--g:#D4AF37;--d:#0D1117;--d2:#161B22;--d3:#21262D;--t:#E6EDF3;--m:#8B949E;--gb:rgba(255,255,255,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Tajawal',sans-serif;background:var(--d);color:var(--t);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}

    .nav{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--gb);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
    .logo{font-size:1.1rem;font-weight:900;color:var(--g);display:flex;align-items:center;gap:.5rem}
    .search{flex:1;max-width:300px;background:var(--d3);border:1px solid var(--gb);border-radius:50px;display:flex;align-items:center;gap:.5rem;padding:.4rem .85rem}
    .search input{background:none;border:none;color:var(--t);font-family:'Tajawal',sans-serif;font-size:.85rem;outline:none;width:100%}
    .search input::placeholder{color:var(--m)}

    .hero{background:linear-gradient(135deg,#0D1117 0%,rgba(14,124,123,.25) 50%,#0D1117 100%);padding:2rem 1rem 1.75rem;text-align:center}
    .hero h1{font-size:clamp(1.7rem,5vw,2.6rem);font-weight:900;margin-bottom:.35rem}
    .hero h1 span{background:linear-gradient(135deg,#fff,var(--g),#C9632A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero p{color:var(--m);font-size:.88rem;margin-bottom:1.1rem}
    .stats{display:flex;justify-content:center;gap:1.25rem;flex-wrap:wrap}
    .st{text-align:center}
    .st strong{display:block;font-size:1.2rem;font-weight:900;color:var(--g)}
    .st span{font-size:.7rem;color:var(--m)}

    .filters{display:flex;gap:.5rem;overflow-x:auto;padding:.8rem 1rem;scrollbar-width:none;border-bottom:1px solid var(--gb)}
    .filters::-webkit-scrollbar{display:none}
    .fb{background:var(--d3);border:1px solid var(--gb);color:var(--m);padding:.38rem .95rem;border-radius:50px;font-size:.78rem;font-weight:700;white-space:nowrap;cursor:pointer;font-family:'Tajawal',sans-serif;transition:background .2s,color .2s}
    .fb.on{background:var(--g);color:#0D1117;border-color:var(--g)}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.8rem;padding:.9rem}
    @media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}}
    @media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem;padding:1.25rem}}

    .card{background:var(--d2);border:1px solid var(--gb);border-radius:14px;overflow:hidden;cursor:pointer;display:block;color:inherit;will-change:transform;transition:transform .25s,box-shadow .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
    .card:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(212,175,55,.15)}
    .card:active{transform:scale(.98)}

    .ci{position:relative;padding-top:72%;overflow:hidden;background:var(--d3)}
    .ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
    .card:hover .ci img{transform:scale(1.05)}
    .badge{position:absolute;top:7px;right:7px;padding:.18rem .55rem;border-radius:50px;font-size:.6rem;font-weight:800;color:#fff}

    .cb{padding:.85rem}
    .ct{font-size:.66rem;font-weight:700;color:var(--g);margin-bottom:.18rem}
    .cn{font-size:.92rem;font-weight:900;margin-bottom:.25rem;line-height:1.3}
    .cs{font-size:.73rem;color:var(--m);margin-bottom:.55rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
    .cf{display:flex;align-items:center;justify-content:space-between}
    .cp{display:flex;flex-direction:column}
    .co{font-size:.66rem;color:var(--m);text-decoration:line-through}
    .cn2{font-size:1.05rem;font-weight:900;color:var(--g)}
    .cn2 small{font-size:.62rem;font-weight:400}
    .ca{background:var(--g);color:#0D1117;border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900;flex-shrink:0}

    .empty{text-align:center;padding:4rem 1rem;color:var(--m);font-size:.95rem}
    footer{padding:1.75rem 1rem;text-align:center;border-top:1px solid var(--gb);color:var(--m);font-size:.78rem}
    footer strong{color:var(--g)}
  </style>
</head>
<body>

  <nav class="nav">
    <div class="logo">
      <img src="images/logo.png" alt="Logo" style="height:36px;width:36px;object-fit:cover;border-radius:50%;border:1.5px solid var(--g);box-shadow:0 0 12px rgba(212,175,55,0.4)"/>
      <span>بيبيات الأطلس</span>
    </div>
    <div class="search">
      <span>🔍</span>
      <input type="text" id="q" placeholder="ابحث عن طير..." autocomplete="off"/>
    </div>
  </nav>

  <div class="hero">
    <h1><span>بيبيات الأطلس</span></h1>
    <p>متجر الطيور الأول بالمغرب 🇲🇦 — جودة مضمونة وأسعار مناسبة</p>
    <div class="stats">
      <div class="st"><strong>+800</strong><span>زبون سعيد</span></div>
      <div class="st"><strong>8</strong><span>أنواع</span></div>
      <div class="st"><strong>5★</strong><span>تقييم</span></div>
      <div class="st"><strong>100%</strong><span>مضمون</span></div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="fb on" data-f="all">الكل</button>
    <button class="fb" data-f="singing">🎵 غناء</button>
    <button class="fb" data-f="parrot">🦜 ببغاء</button>
    <button class="fb" data-f="small">🐦 صغير</button>
    <button class="fb" data-f="premium">👑 بريميوم</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer><strong>بيبيات الأطلس</strong> — صنع بالمغرب 🇲🇦 بكل حب 💛</footer>

  <script src="data.js"></script>
  <script>
    var active='all', timer=0;

    function render(list){
      var g=document.getElementById('grid');
      if(!list.length){g.innerHTML='<div class="empty">😔 ما كاين حتى طير بهاد البحث</div>';return;}
      g.innerHTML=list.map(function(b){
        return '<a class="card" href="product.html?id='+b.id+'">'
          +'<div class="ci"><img src="'+(b.image||b.images[0])+'" alt="'+b.name+'" loading="lazy" decoding="async" width="300" height="220"/>'
          +'<div class="badge" style="background:'+b.badgeColor+'">'+b.badge+'</div></div>'
          +'<div class="cb"><div class="ct">'+b.emoji+' '+b.type+'</div>'
          +'<div class="cn">'+b.name+'</div>'
          +'<div class="cs">'+b.shortDesc+'</div>'
          +'<div class="cf"><div class="cp"><span class="co">'+b.oldPrice+' درهم</span>'
          +'<span class="cn2">'+b.price+' <small>درهم</small></span></div>'
          +'<div class="ca">←</div></div></div></a>';
      }).join('');
    }

    function applyFilter(){
      var q=document.getElementById('q').value.trim().toLowerCase();
      var list=BIRD_LIST.filter(function(b){
        return (active==='all'||b.category.includes(active))&&
               (!q||b.name.includes(q)||b.tags.some(function(t){return t.includes(q);})||b.type.includes(q));
      });
      render(list);
    }

    // Filters
    document.getElementById('filters').addEventListener('click',function(e){
      var btn=e.target.closest('.fb');
      if(!btn)return;
      document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      active=btn.dataset.f;
      applyFilter();
    });

    // Search with debounce
    document.getElementById('q').addEventListener('input',function(){
      clearTimeout(timer);
      timer=setTimeout(applyFilter,180);
    });

    // Map image
    BIRD_LIST.forEach(function(b){if(!b.image)b.image=b.images[0];});    // INIT
    render(BIRD_LIST);
  </script>
  <script src="pixels.js"></script>
</body>
</html>
