<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>بيبيات الأطلس | متجر الطيور</title>
  <meta name="description" content="أحسن متجر طيور بالمغرب. كناري، لافبيرد، كوكاتيل، بادجي وأكثر. أسعار مناسبة وجودة مضمونة."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --gold:#D4AF37;--dark:#0D1117;--dark2:#161B22;--dark3:#21262D;
      --text:#E6EDF3;--muted:#8B949E;--glass:rgba(255,255,255,.06);
      --gb:rgba(255,255,255,.1);--terra:#C9632A;--teal:#0E7C7B;
      --r:16px;--tr:all .28s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;background:var(--dark);color:var(--text);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}

    /* NAV */
    .nav{
      position:sticky;top:0;z-index:100;
      background:rgba(13,17,23,.95);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--gb);padding:.8rem 1rem;
      display:flex;align-items:center;justify-content:space-between;gap:1rem;
    }
    .nav-logo{font-size:1.1rem;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:.4rem}
    .nav-logo span:first-child{font-size:1.5rem}
    .nav-search{
      flex:1;max-width:320px;
      background:var(--dark3);border:1px solid var(--gb);border-radius:50px;
      display:flex;align-items:center;gap:.5rem;padding:.45rem .9rem;
    }
    .nav-search input{
      background:none;border:none;color:var(--text);font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
      font-size:.85rem;outline:none;width:100%;
    }
    .nav-search input::placeholder{color:var(--muted)}

    /* HERO STRIP */
    .hero-strip{
      background:linear-gradient(135deg,#0D1117 0%,rgba(14,124,123,.3) 50%,#0D1117 100%);
      padding:2.5rem 1rem 2rem;text-align:center;
    }
    .hero-strip h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:.4rem}
    .hero-strip h1 span{
      background:linear-gradient(135deg,#fff,var(--gold),var(--terra));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .hero-strip p{color:var(--muted);font-size:.9rem;margin-bottom:1.2rem}
    .hero-stats{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap}
    .hs{text-align:center}
    .hs strong{display:block;font-size:1.3rem;font-weight:900;color:var(--gold)}
    .hs span{font-size:.72rem;color:var(--muted)}

    /* FILTER */
    .filters{
      display:flex;gap:.5rem;overflow-x:auto;padding:.9rem 1rem;
      scrollbar-width:none;border-bottom:1px solid var(--gb);
    }
    .filters::-webkit-scrollbar{display:none}
    .fb{
      background:var(--dark3);border:1px solid var(--gb);color:var(--muted);
      padding:.4rem 1rem;border-radius:50px;font-size:.78rem;font-weight:600;
      white-space:nowrap;cursor:pointer;transition:var(--tr);border:none;font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
    }
    .fb.on{background:var(--gold);color:#0D1117}

    /* GRID */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:.9rem;padding:1rem;
    }
    @media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
    @media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.2rem;padding:1.5rem}}

    /* CARD */
    .card{
      background:var(--dark2);border:1px solid var(--gb);border-radius:var(--r);
      overflow:hidden;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
      -webkit-tap-highlight-color:transparent;
      text-decoration:none;color:inherit;display:block;
      opacity:0;transform:translateY(20px);
    }
    .card.visible{opacity:1;transform:translateY(0);transition:opacity .5s ease,transform .5s ease,border-color .3s,box-shadow .3s}
    .card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 35px rgba(0,0,0,.4),0 0 0 1px rgba(212,175,55,.2)}
    .card:active{transform:scale(.98)}

    .card-img{position:relative;padding-top:75%;overflow:hidden;background:var(--dark3)}
    .card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .card:hover .card-img img{transform:scale(1.06)}
    .card-badge{
      position:absolute;top:8px;right:8px;z-index:2;
      padding:.2rem .6rem;border-radius:50px;font-size:.62rem;font-weight:800;
    }
    .card-body{padding:.9rem}
    .card-type{font-size:.68rem;font-weight:700;color:var(--gold);margin-bottom:.2rem}
    .card-name{font-size:.95rem;font-weight:900;margin-bottom:.3rem;line-height:1.3}
    .card-short{font-size:.75rem;color:var(--muted);margin-bottom:.6rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
    .card-price{display:flex;flex-direction:column}
    .card-old{font-size:.68rem;color:var(--muted);text-decoration:line-through}
    .card-new{font-size:1.1rem;font-weight:900;color:var(--gold)}
    .card-new small{font-size:.65rem;font-weight:400}
    .card-arrow{
      background:var(--gold);color:#0D1117;border:none;border-radius:50%;
      width:32px;height:32px;display:flex;align-items:center;justify-content:center;
      font-size:.9rem;font-weight:900;flex-shrink:0;transition:var(--tr);
    }
    .card:hover .card-arrow{transform:scale(1.15)}

    /* FOOTER */
    .footer{padding:2rem 1rem;text-align:center;border-top:1px solid var(--gb);color:var(--muted);font-size:.8rem}
    .footer strong{color:var(--gold)}
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-logo"><span>🦜</span><span>بيبيات الأطلس</span></div>
    <div class="nav-search">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث عن طير..."/>
    </div>
  </nav>

  <div class="hero-strip">
    <h1><span>بيبيات الأطلس</span></h1>
    <p>متجر الطيور الأول بالمغرب 🇲🇦 — جودة مضمونة وأسعار مناسبة</p>
    <div class="hero-stats">
      <div class="hs"><strong>+800</strong><span>زبون سعيد</span></div>
      <div class="hs"><strong>8</strong><span>أنواع</span></div>
      <div class="hs"><strong>5★</strong><span>تقييم</span></div>
      <div class="hs"><strong>100%</strong><span>مضمون</span></div>
    </div>
  </div>

  <div class="filters">
    <button class="fb on" data-f="all">الكل</button>
    <button class="fb" data-f="singing">🎵 غناء</button>
    <button class="fb" data-f="parrot">🦜 ببغاء</button>
    <button class="fb" data-f="small">🐦 صغير</button>
    <button class="fb" data-f="premium">👑 بريميوم</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer class="footer">
    <strong>بيبيات الأطلس</strong> — صنع بالمغرب 🇲🇦 بكل حب 💛
  </footer>

  <script src="data.js"></script>
  <script>
    // RENDER CARDS
    function render(list) {
      const grid = document.getElementById('grid');
      grid.innerHTML = list.map(b => `
        <a class="card" href="product.html?id=${b.id}">
          <div class="card-img">
            <img src="${b.image || b.images[0]}" alt="${b.name}" loading="lazy"/>
            <div class="card-badge" style="background:${b.badgeColor};color:#fff">${b.badge}</div>
          </div>
          <div class="card-body">
            <div class="card-type">${b.emoji} ${b.type}</div>
            <div class="card-name">${b.name}</div>
            <div class="card-short">${b.shortDesc}</div>
            <div class="card-foot">
              <div class="card-price">
                <span class="card-old">${b.oldPrice} درهم</span>
                <span class="card-new">${b.price} <small>درهم</small></span>
              </div>
              <div class="card-arrow">←</div>
            </div>
          </div>
        </a>
      `).join('');

      // Animate in
      setTimeout(() => {
        document.querySelectorAll('.card').forEach((c,i) => {
          setTimeout(() => c.classList.add('visible'), i * 60);
        });
      }, 50);
    }

    // FILTERS
    let active = 'all';
    document.querySelectorAll('.fb').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        active = btn.dataset.f;
        applyFilter();
      });
    });

    // SEARCH
    document.getElementById('searchInput').addEventListener('input', applyFilter);

    function applyFilter() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const list = BIRD_LIST.filter(b => {
        const matchCat = active === 'all' || b.category.includes(active);
        const matchQ = !q || b.name.includes(q) || b.tags.some(t => t.includes(q)) || b.type.includes(q);
        return matchCat && matchQ;
      });
      render(list);
    }

    // Map image field
    BIRD_LIST.forEach(b => { if(!b.image) b.image = b.images[0]; });

    // INIT
    render(BIRD_LIST);
  </script>
</body>
</html>
