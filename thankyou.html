  <script src="pixels.js"></script>

    :root {
      --gold: #D4AF37; --dark: #0D1117; --dark3: #21262D;
      --text: #E6EDF3; --muted: #8B949E; --gb: rgba(255,255,255,0.08);
      --green: #22C55E; --r: 24px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif; background: var(--dark);
      color: var(--text); direction: rtl; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative;
    }
    .glow-1 { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 70%); top: -100px; right: -100px; z-index: 0; animation: float 8s ease-in-out infinite; }
    .glow-2 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%); bottom: -150px; left: -100px; z-index: 0; animation: float 10s ease-in-out infinite reverse; }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(30px) scale(1.1); } }
    .container {
      position: relative; z-index: 10; width: 90%; max-width: 500px;
      background: rgba(22,27,34,0.6); backdrop-filter: blur(24px); border: 1px solid rgba(212,175,55,0.3);
      border-radius: var(--r); padding: 3rem 2rem; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0; transform: translateY(40px) scale(0.95);
    }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0) scale(1); } }
    .icon-box {
      width: 90px; height: 90px; background: linear-gradient(135deg, var(--green), #10B981);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem; font-size: 3rem; color: #fff; box-shadow: 0 10px 30px rgba(34,197,94,0.4); position: relative;
    }
    .icon-box::before {
      content: ''; position: absolute; inset: -8px; border: 2px dashed rgba(34,197,94,0.4); border-radius: 50%; animation: spin 10s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    .sub-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; }
    .steps { background: var(--dark3); border: 1px solid var(--gb); border-radius: 16px; padding: 1.25rem; text-align: right; margin-bottom: 2rem; }
    .step { display: flex; align-items: flex-start; gap: 0.8rem; margin-bottom: 1rem; }
    .step:last-child { margin-bottom: 0; }
    .step-icon { width: 28px; height: 28px; border-radius: 50%; background: rgba(212,175,55,0.15); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 900; flex-shrink: 0; }
    .step-text { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
    .step-text strong { color: var(--text); display: block; font-size: 0.95rem; margin-bottom: 0.1rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 1rem; border-radius: 50px; background: linear-gradient(135deg, var(--gold), #C9632A); color: #0D1117; font-size: 1.1rem; font-weight: 900; text-decoration: none; border: none; cursor: pointer; box-shadow: 0 8px 24px rgba(212,175,55,0.4); transition: all 0.3s; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(212,175,55,0.6); }
    .confetti { position: absolute; width: 10px; height: 10px; background-color: var(--gold); opacity: 0; }
  </style>
</head>

  <div class="glow-2"></div>
  <div class="container">
    <div class="icon-box"><span>✓</span></div>
    <h1>ألف مبروك!</h1>
    <div class="sub-text">طلبك تبرمج بنجاح يا <span id="customerName" style="color:var(--gold)">صديقنا</span> 🎉</div>
    <div class="steps">
      <div class="step"><div class="step-icon">1</div><div class="step-text"><strong>طلبك راه فـ السيستيم</strong>حنا دابا كنوجدو الطير ديالك.</div></div>

    </div>
    <a href="index.html" class="btn">رجوع للمتجر 🦜</a>
  </div>

    }, 1000);
